# Content-Security-Policy for HTML responses (production only — the local Vite dev
# server on :5173 and hot reload need a looser policy).
# Livewire + Alpine's standard build evaluate expressions, hence 'unsafe-eval';
# moving to nonce-based CSP with Alpine's CSP build is tracked in docs/SECURITY.md (V14.4).
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://checkout.stripe.com https://*.tap.company https://*.paytabs.com https://*.myfatoorah.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https://fonts.bunny.net; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://www.googletagmanager.com; connect-src 'self' wss: https:; frame-src 'self' https://js.stripe.com https://www.youtube-nocookie.com https://player.vimeo.com https://*.tap.company; worker-src 'self' blob:; upgrade-insecure-requests" always;
