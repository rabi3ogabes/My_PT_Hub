# Shared Laravel location rules. Expects $php_upstream and root to be set by the server block.
index index.php;
charset utf-8;

location = /nginx-health { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }

# Universal links / app links must be served as JSON without redirects.
location ^~ /.well-known/ { try_files $uri /index.php?$query_string; }

# Reverb (Pusher protocol) — same origin so browsers and apps need no extra CORS.
location ~ ^/(app|apps)/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_pass http://$reverb_upstream;
}

# Fingerprinted Vite assets: cache forever.
location ^~ /build/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}

location ~* \.(?:css|js|mjs|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|avif|ico|m3u8|ts)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.php?$query_string;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ ^/index\.php(/|$) {
    fastcgi_pass $php_upstream;
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_param HTTP_X_REQUEST_ID $request_id;
    fastcgi_param HTTP_PROXY "";
    fastcgi_buffers 16 32k;
    fastcgi_buffer_size 64k;
    fastcgi_read_timeout 120s;
    internal;
}

# Never serve other PHP files, dotfiles or source maps.
location ~ \.php$ { return 404; }
location ~ /\.(?!well-known) { deny all; }
location ~* \.map$ { deny all; }
