# gzip (universal) + brotli (preferred by modern browsers; ~15-20 % smaller).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/javascript
           application/json application/ld+json application/manifest+json application/xml
           application/rss+xml application/atom+xml image/svg+xml font/ttf font/otf
           application/vnd.apple.mpegurl text/calendar;

brotli on;
brotli_static on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types text/plain text/css text/xml text/javascript application/javascript
             application/json application/ld+json application/manifest+json application/xml
             application/rss+xml application/atom+xml image/svg+xml font/ttf font/otf
             application/vnd.apple.mpegurl text/calendar;
