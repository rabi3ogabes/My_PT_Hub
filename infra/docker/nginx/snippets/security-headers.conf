# Security headers applied at the edge. The Laravel SecurityHeaders middleware sets
# the same baseline for responses that bypass nginx (tests, Octane); `always`
# makes nginx add them to error responses too.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(self), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
# Browsers ignore HSTS on plain HTTP, so this is safe in local dev too.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
