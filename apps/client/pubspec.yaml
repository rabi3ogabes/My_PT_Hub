name: aurum_client
description: Aurum — premium personal training client app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  aurum_core:
    path: ../../packages/core
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  intl: ^0.20.3
  fl_chart: ^1.3.0
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  mobile_scanner: ^7.4.3
  image_picker: ^1.2.4
  camera: ^0.12.2
  record: ^7.1.2
  local_auth: ^3.0.2
  url_launcher: ^6.3.3
  app_links: ^7.2.2
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  video_player: ^2.14.1
  collection: ^1.19.1
  device_calendar_plus: ^0.12.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
