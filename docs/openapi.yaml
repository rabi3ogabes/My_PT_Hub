openapi: "3.1.0"
info:
  title: Aurum API
  version: "1.0.0"
  summary: "REST API shared by the Aurum web dashboard, coach and client apps, and the public developer API."
  description: "Source of truth for paths: `backend/routes/api.php`; payload shapes: `docs/API_CONTRACT.md`. This file is generated by `node infra/scripts/openapi/generate.mjs`; CI fails when a route is undocumented.\n\n**Local development.** `docker compose up` serves the API at `http://localhost:8000/api/v1`.\n\n**Envelope.** Every response is `{data, meta, links, errors}`. Errors carry `code`, `message` and optional `field_errors`.\n\n**Tenancy.** Tenant-scoped endpoints resolve the tenant from `X-Tenant` (id or slug), the subdomain, or the user's current tenant.\n\n**Localization.** `Accept-Language: ar|fr|en|es` localizes messages and translatable fields. Units are metric; money is `{amount_minor, currency, formatted}`; datetimes are ISO 8601 UTC.\n\n**Pagination.** Feeds use cursor pagination (`?cursor=` + `meta.next_cursor`); admin tables use `?page=`. Filtering: `filter[field]=`, sorting: `sort=-created_at`, search: `q=`.\n\n**Realtime (Reverb / Pusher protocol).** `private-tenant.{id}` (staff), `private-user.{id}` (`conversation.updated`, notifications), `presence-conversation.{id}` (`message.sent`, `message.updated`, `message.deleted`, `typing`). Authorize at `POST /broadcasting/auth` with the bearer token.\n\n**Rate limits.** `api` 120/min per user, `auth` 10/min per IP and per account, `ai` 20/min per user, `public` 30/min per IP. See `x-rate-limit` on each operation."
  contact:
    name: Aurum Engineering
    email: "support@aurum.coach"
    url: "https://aurum.coach"
  license:
    name: Proprietary
    identifier: LicenseRef-Aurum-Proprietary
servers:
  - url: "https://api.aurum.coach/api/v1"
    description: Production
  - url: "https://api.staging.aurum.coach/api/v1"
    description: Staging
security:
  - bearerAuth: []
