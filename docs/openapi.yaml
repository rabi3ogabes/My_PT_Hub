components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: "Access token (60 min) with the `access` ability. Rotate with `POST /auth/refresh`."
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum:
          - en
          - ar
          - fr
          - es
        default: en
      description: "Response language; falls back to user preference then tenant default."
    XTenant:
      name: X-Tenant
      in: header
      required: false
      schema:
        type: string
      description: "Tenant id or slug. Defaults to the user's current tenant."
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: "Strongly recommended on payment POSTs. A repeated key within 24 h replays the stored response (`Idempotent-Replay: true`)."
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
      description: "ETag from a previous response; returns 304 when unchanged."
  responses:
    E401:
      description: "Unauthenticated — refresh then retry, else sign out"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: {}
            links: {}
            errors:
              - code: unauthenticated
                message: "Unauthenticated — refresh then retry, else sign out"
    E402:
      description: Plan limit reached or feature not in plan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: {}
            links: {}
            errors:
              - code: plan_limit_reached
                message: Plan limit reached or feature not in plan
    E403:
      description: "Forbidden (role, ownership or tenant)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: {}
            links: {}
            errors:
              - code: forbidden
                message: "Forbidden (role, ownership or tenant)"
    E404:
      description: "Not found (or not visible in this tenant)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: {}
            links: {}
            errors:
              - code: not_found
                message: "Not found (or not visible in this tenant)"
    E409:
      description: "Conflict (capacity, state or idempotency in progress)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: {}
            links: {}
            errors:
              - code: conflict
                message: "Conflict (capacity, state or idempotency in progress)"
    E410:
      description: "Gone (invitation expired or used)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: {}
            links: {}
            errors:
              - code: invitation_invalid
                message: "Gone (invitation expired or used)"
    E422:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: {}
            links: {}
            errors:
              - code: validation_failed
                message: Validation failed
                field_errors:
                  email:
                    - The email field is required.
    E423:
      description: Account locked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: {}
            links: {}
            errors:
              - code: account_locked
                message: Account locked
    E429:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: {}
            links: {}
            errors:
              - code: too_many_requests
                message: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the limit resets
  schemas:
    Ulid:
      type: string
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
      description: "ULID (26 chars, Crockford base32). Client-generated for offline rows."
      examples:
        - "01JBX6Q5Z8K3M4N5P6Q7R8S9T0"
    Locale:
      type: string
      enum:
        - en
        - ar
        - fr
        - es
    Money:
      type: object
      properties:
        amount_minor:
          type: integer
        currency:
          type: string
        formatted:
          type: string
      required:
        - amount_minor
        - currency
        - formatted
    Macros:
      type: object
      properties:
        kcal:
          type: number
        protein_g:
          type: number
        carbs_g:
          type: number
        fat_g:
          type: number
      required:
        - kcal
        - protein_g
        - carbs_g
        - fat_g
    Translations:
      type: object
      description: Raw translatable value keyed by locale.
      properties:
        en:
          type: string
        ar:
          type: string
        fr:
          type: string
        es:
          type: string
      additionalProperties: false
    ErrorItem:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        field_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - code
        - message
    ErrorEnvelope:
      type: object
      properties:
        data:
          type: "null"
        meta:
          type: object
          additionalProperties: true
        links:
          type: object
          additionalProperties: true
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorItem"
      required:
        - data
        - meta
        - links
        - errors
    CursorMeta:
      type: object
      properties:
        per_page:
          type: integer
        next_cursor:
          type:
            - string
            - "null"
        prev_cursor:
          type:
            - string
            - "null"
      required:
        - per_page
        - next_cursor
        - prev_cursor
    PageMeta:
      type: object
      properties:
        per_page:
          type: integer
        current_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer
      required:
        - per_page
        - current_page
        - total
        - last_page
    Links:
      type: object
      properties:
        next:
          type:
            - string
            - "null"
          format: uri
        prev:
          type:
            - string
            - "null"
          format: uri
      required:
        - next
        - prev
    User:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
        first_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type:
            - string
            - "null"
        avatar_url:
          type:
            - string
            - "null"
          format: uri
        locale:
          $ref: "#/components/schemas/Locale"
        timezone:
          type: string
        units:
          type: string
          enum:
            - metric
