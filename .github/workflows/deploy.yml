name: Deploy

# main  → build + push images → staging (automatic)
# v*.*.* tag → build + push images → production (GitHub environment "production"
#              requires a manual approval; configure required reviewers in repo settings)
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: Image tag to deploy (defaults to this commit's sha)
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-checks:
    uses: ./.github/workflows/backend.yml

  build:
    name: Build & push images
    needs: backend-checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      registry: ${{ steps.meta.outputs.registry }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        name: Compute image names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "registry=ghcr.io/${owner}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; else echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push app (php-fpm)
        id: app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/production/Dockerfile
          target: app
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.meta.outputs.registry }}/aurum-app:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.registry }}/aurum-app:${{ startsWith(github.ref, 'refs/tags/') && 'latest' || 'main' }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Build & push web (nginx)
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/production/Dockerfile
          target: web
          push: true
          provenance: mode=max
          tags: |
            ${{ steps.meta.outputs.registry }}/aurum-web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.registry }}/aurum-web:${{ startsWith(github.ref, 'refs/tags/') && 'latest' || 'main' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Attest app image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.meta.outputs.registry }}/aurum-app
          subject-digest: ${{ steps.app.outputs.digest }}
          push-to-registry: true
      - name: Scan app image (fail on critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.registry }}/aurum-app:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  staging:
    name: Deploy → staging
    needs: build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: https://staging.aurum.coach
    steps:
      - uses: actions/checkout@v7
      - name: Blue/green deploy
        uses: ./.github/actions/ssh-deploy
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          registry: ${{ needs.build.outputs.registry }}
          tag: ${{ inputs.ref || needs.build.outputs.tag }}
          ghcr-token: ${{ secrets.GHCR_PULL_TOKEN }}
          ghcr-user: ${{ secrets.GHCR_PULL_USER }}
          public-url: https://staging.aurum.coach

  production:
    name: Deploy → production
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-24.04
    environment:
      name: production   # protected: required reviewers = manual approval gate
      url: https://aurum.coach
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Blue/green deploy
        uses: ./.github/actions/ssh-deploy
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          registry: ${{ needs.build.outputs.registry }}
          tag: ${{ inputs.ref || needs.build.outputs.tag }}
          ghcr-token: ${{ secrets.GHCR_PULL_TOKEN }}
          ghcr-user: ${{ secrets.GHCR_PULL_USER }}
          public-url: https://aurum.coach
      - name: Sentry release
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          npx -y @sentry/cli@2.39.1 releases new "aurum@${{ needs.build.outputs.tag }}"
          npx -y @sentry/cli@2.39.1 releases set-commits "aurum@${{ needs.build.outputs.tag }}" --auto
          npx -y @sentry/cli@2.39.1 releases finalize "aurum@${{ needs.build.outputs.tag }}"
          npx -y @sentry/cli@2.39.1 releases deploys "aurum@${{ needs.build.outputs.tag }}" new -e production
